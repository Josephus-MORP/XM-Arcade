name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Single-file web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone HTML
        run: python3 tools/build-web.py
      - uses: actions/upload-artifact@v4
        with:
          name: XM-Arcade-standalone
          path: release/XM-Arcade-standalone.html

  apk-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK
        run: ./tools/build-apk.sh debug
      - uses: actions/upload-artifact@v4
        with:
          name: XM-Arcade-debug-apk
          path: release/XM-Arcade-debug.apk

  release:
    name: Signed release APK
    # Version tags trigger this, but it quietly skips itself when no signing
    # secrets are set — so manual browser-made releases don't show an error.
    if: startsWith(github.ref, 'refs/tags/v') && secrets.XM_KEYSTORE_BASE64 != ''
    needs: [web, apk-debug]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Restore signing key
        env:
          XM_KEYSTORE_BASE64: ${{ secrets.XM_KEYSTORE_BASE64 }}
        run: |
          echo "$XM_KEYSTORE_BASE64" | base64 -d > /tmp/xm-release.keystore
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_XM_STORE_FILE: /tmp/xm-release.keystore
          ORG_GRADLE_PROJECT_XM_STORE_PASSWORD: ${{ secrets.XM_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_XM_KEY_ALIAS: ${{ secrets.XM_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_XM_KEY_PASSWORD: ${{ secrets.XM_KEY_PASSWORD }}
        run: ./tools/build-apk.sh release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/XM-Arcade-v*.apk
            release/XM-Arcade-standalone.html
          body_path: CHANGELOG.md
