<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hello Arcade</title>
<script src="../webxdc.js"></script>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f1220;color:#fff;font-family:ui-sans-serif,system-ui,sans-serif}
  .c{text-align:center;padding:24px} h1{font-size:22px;margin:0 0 6px} p{color:#9aa; font-size:13px}
  .n{font-size:64px;font-weight:800;margin:14px 0} button{font-size:17px;font-weight:700;border:0;border-radius:14px;padding:14px 34px;background:#8b7bff;color:#fff;cursor:pointer}
  button:active{transform:scale(.96)} .log{margin-top:14px;font-size:12px;color:#8b93a1;min-height:18px}
</style></head>
<body><div class="c">
  <h1>Hello Arcade 👋</h1>
  <p>One counter, every player. Tap to +1.</p>
  <div class="n" id="n">0</div>
  <button id="b">+1</button>
  <div class="log" id="log"></div>
</div>
<script>
  var count = 0, el = document.getElementById('n'), log = document.getElementById('log');
  function render(){ el.textContent = count; }
  document.getElementById('b').onclick = function(){
    count++; render();
    webxdc.sendUpdate({payload: count}, 'counter is ' + count);
  };
  webxdc.setUpdateListener(function(updates){
    updates.forEach(function(u){
      if (typeof u.payload.payload === 'number') { count = Math.max(count, u.payload.payload); render(); }
      if (u.summary) log.textContent = u.summary;
    });
  }, 0);
  render();
</script></body></html>
